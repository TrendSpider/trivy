name: build-release

# Builds trivy binaries from the mirrored source and publishes them as a
# GitHub Release in this repo. Asset names match upstream exactly
# (trivy_<ver>_Linux-64bit.tar.gz, ...) so the official install.sh / curl work.
#
# Trigger: after each successful mirror-sync (new tags are already present),
# builds the newest tag that has no Release yet. Manual runs can target any tag.
#
# Auth: secret MIRROR_PAT (Contents: write — to create releases).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. v0.74.0 (empty = newest tag without a release)"
        required: false
      scan_only:
        description: "Only run the security scan on the tag (no build, no release)"
        type: boolean
        default: false
  workflow_run:
    workflows: ["mirror-sync"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    # Skip if the triggering mirror-sync failed; always run on manual dispatch.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.MIRROR_PAT }}
      REPO: ${{ github.repository }}
    steps:
      - name: Determine tag to build
        id: pick
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            # newest vX.Y.Z tag in this repo
            TAG=$(gh api "repos/$REPO/tags?per_page=100" --jq '.[].name' \
                  | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          fi
          echo "Selected tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ -z "$TAG" ]; then
            echo "No matching tag found."; echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ github.event.inputs.scan_only }}" = "true" ]; then
            echo "scan_only mode — will run the scan on $TAG without building/releasing."
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout source at tag
        if: steps.pick.outputs.build == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pick.outputs.tag }}
          fetch-depth: 1

      # Use the latest PATCH of go.mod's MINOR (e.g. 1.26.x), not "stable".
      # Same minor keeps Trivy's experimental encoding/json/v2 API compatible
      # (so it compiles), while the newest patch already has the stdlib security
      # fixes — so govulncheck doesn't fail on already-patched stdlib CVEs.
      - name: Determine Go minor from go.mod
        id: gomod
        if: steps.pick.outputs.build == 'true'
        run: echo "minor=$(grep -m1 '^go ' go.mod | awk '{print $2}' | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: steps.pick.outputs.build == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "${{ steps.gomod.outputs.minor }}.x"

      # Scan the source with TWO independent engines BEFORE building. If either
      # finds a fixable HIGH/CRITICAL vulnerability, this step fails and the
      # build/release steps below are skipped (job stops on first failure).
      - name: Security scan (govulncheck + Grype + osv-scanner)
        if: steps.pick.outputs.build == 'true'
        env:
          GOEXPERIMENT: jsonv2   # Trivy needs encoding/json/v2 to compile
        run: |
          set -uo pipefail   # NOT -e: run all three scanners, decide at the end

          banner() {   # big banner: tool / version / GitHub
            echo ""
            echo "╔══════════════════════════════════════════════════════════════════════╗"
            printf "║  🔍  %-64s║\n" "$1"
            printf "║      version : %-54s║\n" "$2"
            printf "║      github  : %-54s║\n" "$3"
            printf "║      role    : %-54s║\n" "$4"
            echo "╚══════════════════════════════════════════════════════════════════════╝"
            echo ""
          }
          FAILED=0

          # ── 1) govulncheck — GATE (reachability: only vulns actually called) ──
          go install golang.org/x/vuln/cmd/govulncheck@latest
          GOVULN="$(go env GOPATH)/bin/govulncheck"
          banner "govulncheck (Go official)" \
                 "$("$GOVULN" -version 2>/dev/null | head -1)" \
                 "https://github.com/golang/vuln" \
                 "GATE — reachability, blocks build"
          "$GOVULN" ./... || { echo "::error::govulncheck: reachable vulnerabilities found"; FAILED=1; }

          # ── 2) Grype — GATE (independent SCA; no testdata; critical only) ──
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin >/dev/null 2>&1
          banner "Grype (Anchore)" \
                 "$(grype version 2>/dev/null | awk -F': *' '/^Version/{print $2; exit}')" \
                 "https://github.com/anchore/grype" \
                 "GATE — SCA, blocks on fixable CRITICAL"
          grype dir:. --exclude './**/testdata/**' --exclude './**/integration/**' \
                --only-fixed --fail-on critical || { echo "::error::Grype: fixable CRITICAL found"; FAILED=1; }

          # ── 3) osv-scanner — INFO (Google OSV base, root go.sum only) ──
          # No reachability and no severity threshold, so it also reports vulns
          # that aren't reachable in the binary — kept informational (does not
          # block). Gives a third, independent database (OSV) for visibility.
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@latest
          OSV="$(go env GOPATH)/bin/osv-scanner"
          banner "osv-scanner (Google OSV)" \
                 "$("$OSV" --version 2>/dev/null | head -1)" \
                 "https://github.com/google/osv-scanner" \
                 "INFO — reports go.sum, does NOT block"
          "$OSV" scan source --lockfile go.sum || echo "::warning::osv-scanner reported vulnerabilities (informational, not blocking)"

          echo ""
          if [ "$FAILED" -ne 0 ]; then
            echo "❌ A blocking scanner failed — build stopped."
            exit 1
          fi
          echo "✅ Blocking scanners (govulncheck + Grype) passed — proceeding to build."

      - name: Build binaries
        if: steps.pick.outputs.build == 'true' && github.event.inputs.scan_only != 'true'
        run: |
          set -euo pipefail
          # Trivy uses the experimental encoding/json/v2, gated behind this flag.
          export GOEXPERIMENT=jsonv2
          TAG="${{ steps.pick.outputs.tag }}"
          VER="${TAG#v}"
          LDFLAGS="-s -w -X github.com/aquasecurity/trivy/pkg/version/app.ver=${VER}"
          mkdir -p dist
          build() {
            goos="$1"; goarch="$2"; label="$3"
            echo "==> building $label (GOOS=$goos GOARCH=$goarch)"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "$LDFLAGS" -o trivy ./cmd/trivy/
            # bundle the same extras upstream ships (best-effort)
            tar -czf "dist/trivy_${VER}_${label}.tar.gz" trivy LICENSE README.md 2>/dev/null \
              || tar -czf "dist/trivy_${VER}_${label}.tar.gz" trivy
            rm -f trivy
          }
          build linux amd64 Linux-64bit
          build linux arm64 Linux-ARM64
          ( cd dist && sha256sum * > "trivy_${VER}_checksums.txt" )
          echo "=== built artifacts ==="; ls -la dist

      - name: Create GitHub Release
        if: steps.pick.outputs.build == 'true' && github.event.inputs.scan_only != 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.pick.outputs.tag }}"
          # If a release already exists (e.g. a concurrent run created it, or the
          # earlier existence check was a false negative), skip WITHOUT failing.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping (no error)."
            exit 0
          fi
          gh release create "$TAG" --repo "$REPO" \
            --title "$TAG" \
            --notes "Trivy binaries built from source by the TrendSpider mirror. Upstream: https://github.com/aquasecurity/trivy/releases/tag/${TAG}" \
            dist/*
          echo "Release $TAG published."
